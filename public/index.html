<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoWorld - AI智能体商业世界</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0e17;
      --bg2: #111827;
      --bg3: #1f2937;
      --border: #374151;
      --text: #e5e7eb;
      --text2: #9ca3af;
      --accent: #3b82f6;
      --accent2: #8b5cf6;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --orange: #f97316;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo span { font-size: 13px; opacity: 0.7; margin-left: 8px; }

    .header-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .time-display {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      font-family: 'Courier New', monospace;
    }

    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    .status-dot.running { background: var(--green); }
    .status-dot.stopped { background: var(--red); animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg3);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .btn:hover { background: var(--accent); border-color: var(--accent); }
    .btn.active { background: var(--green); border-color: var(--green); }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 16px;
      padding: 16px 24px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      overflow: hidden;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title .icon { font-size: 16px; }

    /* Stats Row */
    .stats-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }

    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      margin: 4px 0;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text2);
      text-transform: uppercase;
    }

    /* Leaderboard */
    .leaderboard { grid-column: 1 / 2; grid-row: 3 / 5; }

    .lb-item {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .lb-item:last-child { border-bottom: none; }

    .lb-rank {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .lb-rank.gold { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .lb-rank.silver { background: linear-gradient(135deg, #9ca3af, #6b7280); }
    .lb-rank.bronze { background: linear-gradient(135deg, #d97706, #92400e); }
    .lb-rank.normal { background: var(--bg3); color: var(--text2); }

    .lb-info { flex: 1; min-width: 0; }
    .lb-name { font-weight: 600; font-size: 14px; }
    .lb-detail { font-size: 11px; color: var(--text2); margin-top: 2px; }

    .lb-wealth {
      font-weight: 700;
      font-size: 15px;
      color: var(--yellow);
      text-align: right;
    }

    /* Market Prices */
    .price-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .price-item {
      background: var(--bg3);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price-name { font-size: 13px; color: var(--text2); }
    .price-value { font-size: 16px; font-weight: 700; }

    /* Buildings */
    .building-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .building-item {
      background: var(--bg3);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
    }

    .building-item .type {
      font-weight: 600;
      font-size: 13px;
    }

    .building-item .owner {
      color: var(--text2);
      font-size: 11px;
    }

    .building-item .level {
      color: var(--accent);
      font-size: 11px;
    }

    /* Events Feed */
    .events-feed { grid-column: 3 / 4; grid-row: 3 / 5; }

    .event-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      line-height: 1.5;
    }

    .event-item:last-child { border-bottom: none; }

    .event-time {
      color: var(--accent);
      font-family: monospace;
      font-size: 11px;
    }

    .event-text { color: var(--text); margin-top: 2px; }

    /* Rules */
    .rule-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .rule-item:last-child { border-bottom: none; }
    .rule-name { color: var(--text2); }
    .rule-value { font-weight: 600; color: var(--accent2); }

    /* Bank */
    .bank-stat {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
    }

    .bank-label { color: var(--text2); }
    .bank-value { font-weight: 600; }

    /* Entity table */
    .entity-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .entity-table th {
      text-align: left;
      padding: 6px 8px;
      font-size: 11px;
      color: var(--text2);
      border-bottom: 1px solid var(--border);
    }

    .entity-table td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }

    .entity-table tr:hover { background: var(--bg3); }

    .tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }

    .tag.active { background: rgba(16,185,129,0.2); color: var(--green); }
    .tag.bankrupt { background: rgba(239,68,68,0.2); color: var(--red); }
    .tag.ai { background: rgba(139,92,246,0.2); color: var(--accent2); }
    .tag.human { background: rgba(59,130,246,0.2); color: var(--accent); }

    .progress-bar {
      height: 4px;
      background: var(--bg3);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar .fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.5s;
    }

    .full-width { grid-column: 1 / -1; }

    @media (max-width: 1024px) {
      .dashboard {
        grid-template-columns: 1fr 1fr;
      }
      .stats-row {
        grid-template-columns: repeat(3, 1fr);
      }
      .leaderboard, .events-feed {
        grid-column: auto;
        grid-row: auto;
      }
    }

    @media (max-width: 640px) {
      .dashboard { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:24px;">
      <div class="logo">
        EchoWorld <span>AI智能体商业世界</span>
      </div>
      <nav style="display:flex;gap:4px;">
        <a href="/" style="color:white;background:var(--accent);text-decoration:none;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;">总览</a>
        <a href="/admin" style="color:var(--text2);text-decoration:none;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;">管理</a>
        <a href="/game" style="color:var(--text2);text-decoration:none;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;">游戏</a>
        <a href="/news" style="color:var(--text2);text-decoration:none;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;">新闻</a>
        <a href="/login" style="color:var(--text2);text-decoration:none;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;">登录</a>
      </nav>
    </div>
    <div class="header-info">
      <div>
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">--</span>
      </div>
      <div class="time-display" id="worldTime">--</div>
      <div class="controls">
        <button class="btn" id="btnStart" onclick="controlWorld('start')">启动</button>
        <button class="btn" id="btnStop" onclick="controlWorld('stop')">暂停</button>
        <button class="btn" onclick="controlWorld('tick')">+1 Tick</button>
      </div>
    </div>
  </header>

  <div class="dashboard">
    <!-- Stats Row -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">实体总数</div>
        <div class="stat-value" id="statEntities" style="color: var(--accent)">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">总GDP</div>
        <div class="stat-value" id="statGDP" style="color: var(--green)">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">流通货币</div>
        <div class="stat-value" id="statCurrency" style="color: var(--yellow)">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">建筑总数</div>
        <div class="stat-value" id="statBuildings" style="color: var(--orange)">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">基尼系数</div>
        <div class="stat-value" id="statGini" style="color: var(--accent2)">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">交易总数</div>
        <div class="stat-value" id="statTransactions" style="color: var(--text)">--</div>
      </div>
    </div>

    <!-- Leaderboard -->
    <div class="card leaderboard">
      <div class="card-title"><span class="icon">🏆</span> 财富排行榜</div>
      <div id="leaderboard"></div>
    </div>

    <!-- Market Prices -->
    <div class="card">
      <div class="card-title"><span class="icon">📈</span> 市场价格</div>
      <div class="price-grid" id="marketPrices"></div>
    </div>

    <!-- Events Feed -->
    <div class="card events-feed">
      <div class="card-title"><span class="icon">📋</span> 世界动态</div>
      <div id="eventsFeed" style="max-height: 400px; overflow-y: auto;"></div>
    </div>

    <!-- Buildings -->
    <div class="card">
      <div class="card-title"><span class="icon">🏗️</span> 建筑列表</div>
      <div class="building-grid" id="buildingsList"></div>
      <div id="noBuildingsMsg" style="color: var(--text2); font-size: 13px; text-align: center; padding: 20px;">
        暂无建筑
      </div>
    </div>

    <!-- Bank Stats -->
    <div class="card">
      <div class="card-title"><span class="icon">🏦</span> 银行</div>
      <div id="bankStats"></div>
    </div>

    <!-- Rules -->
    <div class="card">
      <div class="card-title"><span class="icon">📜</span> 世界规则</div>
      <div id="rulesPanel"></div>
    </div>

    <!-- Entity Table -->
    <div class="card full-width">
      <div class="card-title"><span class="icon">🤖</span> 所有实体详情</div>
      <div style="overflow-x: auto;">
        <table class="entity-table">
          <thead>
            <tr>
              <th>名称</th>
              <th>类型</th>
              <th>状态</th>
              <th>货币</th>
              <th>净资产</th>
              <th>信用评分</th>
              <th>声望</th>
              <th>建筑</th>
              <th>存活天数</th>
              <th>食物</th>
              <th>能源</th>
              <th>商品</th>
            </tr>
          </thead>
          <tbody id="entityTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const REFRESH_INTERVAL = 2000;
    let refreshTimer = null;

    const RESOURCE_NAMES = {
      food: '食物',
      material: '原料',
      goods: '商品',
      energy: '能源',
      labor: '劳动力',
    };

    const BUILDING_NAMES = {
      restaurant: '餐厅',
      shop: '商店',
      factory: '工厂',
      farm: '农场',
      bank: '银行',
      house: '住宅',
      warehouse: '仓库',
      market: '市场',
    };

    const EVENT_LABELS = {
      day_start: '📅 新一天',
      day_end: '📊 日终结算',
      entity_created: '🌟 新实体',
      entity_bankrupt: '💀 破产',
      building_built: '🏗️ 建造',
      building_upgraded: '⬆️ 升级',
      transaction: '💰 交易',
      rule_evolved: '📜 规则进化',
      entity_action: '🤖 行动',
    };

    async function fetchData() {
      try {
        const [worldRes, entitiesRes, marketRes, bankRes, rulesRes, eventsRes, buildingsRes] = await Promise.all([
          fetch('/api/world').then(r => r.json()),
          fetch('/api/entities').then(r => r.json()),
          fetch('/api/market').then(r => r.json()),
          fetch('/api/bank').then(r => r.json()),
          fetch('/api/rules').then(r => r.json()),
          fetch('/api/events?count=30').then(r => r.json()),
          fetch('/api/buildings').then(r => r.json()),
        ]);

        updateHeader(worldRes);
        updateStats(worldRes);
        updateLeaderboard(entitiesRes);
        updateMarket(marketRes);
        updateBank(bankRes);
        updateRules(rulesRes);
        updateEvents(eventsRes);
        updateBuildings(buildingsRes);
        updateEntityTable(entitiesRes);
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    function updateHeader(data) {
      const time = data.world?.time;
      const running = true;
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');

      if (time) {
        document.getElementById('worldTime').textContent =
          `第${time.day}天 ${String(time.hour).padStart(2,'0')}:00  Tick #${time.tick}`;
      }

      dot.className = 'status-dot ' + (running ? 'running' : 'stopped');
      text.textContent = running ? '运行中' : '已暂停';
    }

    function updateStats(data) {
      const stats = data.world?.statistics || {};
      document.getElementById('statEntities').textContent = stats.totalEntities ?? '--';
      document.getElementById('statGDP').textContent = fmt(stats.dailyGDP);
      document.getElementById('statCurrency').textContent = fmt(stats.totalCurrencyCirculating);
      document.getElementById('statBuildings').textContent = stats.totalBuildings ?? '--';
      document.getElementById('statGini').textContent = stats.giniCoefficient?.toFixed(3) ?? '--';
      document.getElementById('statTransactions').textContent = stats.totalTransactions ?? '--';
    }

    function updateLeaderboard(entities) {
      const sorted = [...entities].sort((a, b) => b.netWorth - a.netWorth).slice(0, 10);
      const container = document.getElementById('leaderboard');
      container.innerHTML = sorted.map((e, i) => {
        const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal';
        return `
          <div class="lb-item">
            <div class="lb-rank ${rankClass}">${i + 1}</div>
            <div class="lb-info">
              <div class="lb-name">${e.name}</div>
              <div class="lb-detail">${e.type === 'ai_agent' ? '🤖 AI' : '👤 玩家'} · 建筑 ${e.buildings} · 信用 ${e.creditScore}</div>
            </div>
            <div class="lb-wealth">¤ ${fmt(e.netWorth)}</div>
          </div>
        `;
      }).join('');
    }

    function updateMarket(data) {
      const prices = data.prices || {};
      const container = document.getElementById('marketPrices');
      container.innerHTML = Object.entries(prices).map(([key, val]) => `
        <div class="price-item">
          <span class="price-name">${RESOURCE_NAMES[key] || key}</span>
          <span class="price-value">¤ ${Number(val).toFixed(1)}</span>
        </div>
      `).join('');
    }

    function updateBank(data) {
      const container = document.getElementById('bankStats');
      container.innerHTML = `
        <div class="bank-stat"><span class="bank-label">货币总量</span><span class="bank-value">¤ ${fmt(data.totalMoneySupply)}</span></div>
        <div class="bank-stat"><span class="bank-label">贷款总额</span><span class="bank-value" style="color:var(--red)">¤ ${fmt(data.totalLoans)}</span></div>
        <div class="bank-stat"><span class="bank-label">存款总额</span><span class="bank-value" style="color:var(--green)">¤ ${fmt(data.totalDeposits)}</span></div>
        <div class="bank-stat"><span class="bank-label">活跃贷款</span><span class="bank-value">${data.activeLoans}</span></div>
        <div class="bank-stat"><span class="bank-label">基准利率</span><span class="bank-value">${(data.baseInterestRate * 100).toFixed(1)}%</span></div>
        <div class="bank-stat"><span class="bank-label">贷款利率</span><span class="bank-value">${(data.loanInterestRate * 100).toFixed(1)}%</span></div>
        <div class="bank-stat"><span class="bank-label">存款利率</span><span class="bank-value">${(data.depositInterestRate * 100).toFixed(1)}%</span></div>
      `;
    }

    function updateRules(data) {
      const container = document.getElementById('rulesPanel');
      const rules = data.rules || {};
      container.innerHTML = Object.entries(rules).map(([name, info]) => `
        <div class="rule-item">
          <span class="rule-name">${name}</span>
          <span class="rule-value">${Number(info.value).toFixed(3)} <small style="color:var(--text2)">v${info.version}</small></span>
        </div>
      `).join('');
    }

    function updateEvents(events) {
      const container = document.getElementById('eventsFeed');
      const reversed = [...events].reverse().slice(0, 25);
      container.innerHTML = reversed.map(ev => {
        const label = EVENT_LABELS[ev.type] || ev.type;
        const timeStr = ev.timestamp ? `D${ev.timestamp.day} ${String(ev.timestamp.hour).padStart(2,'0')}:00` : '';
        let detail = '';
        if (ev.type === 'entity_action') {
          detail = `${ev.data.entityName}: ${ev.data.action} - ${ev.data.reason || ''}`;
        } else if (ev.type === 'transaction') {
          detail = `${ev.data.resourceType} x${ev.data.amount} @ ¤${Number(ev.data.price).toFixed(1)}`;
        } else if (ev.type === 'building_built') {
          detail = `${BUILDING_NAMES[ev.data.buildingType] || ev.data.buildingType} (¤${ev.data.cost})`;
        } else if (ev.type === 'entity_bankrupt') {
          detail = `${ev.data.entityName} 破产 (存活${ev.data.survivalDays}天)`;
        } else if (ev.type === 'rule_evolved') {
          detail = `${ev.data.ruleName}: ${Number(ev.data.oldValue).toFixed(3)} → ${Number(ev.data.newValue).toFixed(3)}`;
        } else if (ev.type === 'day_start' || ev.type === 'day_end') {
          detail = `第${ev.data.day}天`;
        }
        return `
          <div class="event-item">
            <span class="event-time">${timeStr}</span> ${label}
            <div class="event-text">${detail}</div>
          </div>
        `;
      }).join('');
    }

    function updateBuildings(buildings) {
      const container = document.getElementById('buildingsList');
      const msg = document.getElementById('noBuildingsMsg');
      if (buildings.length === 0) {
        container.innerHTML = '';
        msg.style.display = 'block';
        return;
      }
      msg.style.display = 'none';
      container.innerHTML = buildings.map(b => `
        <div class="building-item">
          <div class="type">${BUILDING_NAMES[b.type] || b.type}</div>
          <div class="level">Lv.${b.level} · 耐久 ${b.durability}%</div>
          <div class="owner">${b.ownerId.slice(0, 8)}...</div>
          <div class="progress-bar">
            <div class="fill" style="width:${b.durability}%; background: ${b.durability > 50 ? 'var(--green)' : b.durability > 25 ? 'var(--yellow)' : 'var(--red)'}"></div>
          </div>
        </div>
      `).join('');
    }

    function updateEntityTable(entities) {
      const tbody = document.getElementById('entityTableBody');
      const sorted = [...entities].sort((a, b) => b.netWorth - a.netWorth);
      tbody.innerHTML = sorted.map(e => `
        <tr>
          <td><strong>${e.name}</strong></td>
          <td><span class="tag ${e.type === 'ai_agent' ? 'ai' : 'human'}">${e.type === 'ai_agent' ? 'AI' : '玩家'}</span></td>
          <td><span class="tag ${e.status}">${e.status === 'active' ? '活跃' : e.status === 'bankrupt' ? '破产' : e.status}</span></td>
          <td>¤ ${fmt(e.currency)}</td>
          <td style="color:var(--yellow);font-weight:600">¤ ${fmt(e.netWorth)}</td>
          <td>${e.creditScore}</td>
          <td>${e.reputation}</td>
          <td>${e.buildings}</td>
          <td>${e.survivalDays}</td>
          <td>${e.inventory?.food?.toFixed(0) ?? 0}</td>
          <td>${e.inventory?.energy?.toFixed(0) ?? 0}</td>
          <td>${e.inventory?.goods?.toFixed(0) ?? 0}</td>
        </tr>
      `).join('');
    }

    function fmt(n) {
      if (n === undefined || n === null) return '--';
      n = Number(n);
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return n.toFixed(0);
    }

    async function controlWorld(action) {
      try {
        await fetch(`/api/world/${action}`, { method: 'POST' });
        setTimeout(fetchData, 300);
      } catch (err) {
        console.error('Control error:', err);
      }
    }

    // Start auto-refresh
    fetchData();
    refreshTimer = setInterval(fetchData, REFRESH_INTERVAL);
  </script>
</body>
</html>
