<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoWorld - 3D</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0a0e17;--bg2:#111827;--bg3:#1f2937;--border:#374151;--text:#e5e7eb;--text2:#9ca3af;
      --accent:#3b82f6;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316;--purple:#a855f7}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
      background:var(--bg);color:var(--text);overflow:hidden;height:100vh;width:100vw}

    /* === 3D Canvas === */
    #canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

    /* === Top Bar (fixed nav) === */
    #top-bar{position:fixed;top:0;left:0;right:0;z-index:20;
      padding:8px 16px;display:flex;justify-content:space-between;align-items:center;
      background:linear-gradient(180deg,rgba(10,14,23,0.92) 0%,rgba(10,14,23,0.75) 80%,rgba(10,14,23,0) 100%);
      backdrop-filter:blur(6px);min-height:48px;flex-wrap:wrap;gap:6px}
    .top-left{display:flex;align-items:center;gap:12px;flex-shrink:0}
    .logo{font-size:15px;font-weight:700;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
    .stat-bars{display:flex;gap:10px;align-items:center}
    .stat-bar{display:flex;align-items:center;gap:4px;font-size:10px}
    .stat-bar .label{width:16px;text-align:center;font-size:12px}
    .stat-bar .bar{width:60px;height:6px;background:#1e293b;border-radius:3px;overflow:hidden}
    .stat-bar .fill{height:100%;border-radius:3px;transition:width .5s}
    .stat-bar .val{width:20px;text-align:right;font-size:9px;color:var(--text2)}
    .fill-hunger{background:linear-gradient(90deg,#ef4444,#f97316)}
    .fill-energy{background:linear-gradient(90deg,#3b82f6,#06b6d4)}
    .fill-happy{background:linear-gradient(90deg,#a855f7,#ec4899)}
    .pos-info{display:inline-block;font-size:11px;color:var(--text2);background:rgba(0,0,0,0.4);padding:3px 12px;border-radius:10px;white-space:nowrap}
    .top-right{display:flex;gap:6px;align-items:center;flex-shrink:0}
    .money-badge{background:linear-gradient(135deg,#f59e0b,#f97316);color:#000;padding:3px 10px;border-radius:10px;font-weight:700;font-size:12px;white-space:nowrap}
    .action-badge{background:rgba(59,130,246,0.2);color:var(--accent);padding:3px 8px;border-radius:8px;font-size:10px;border:1px solid rgba(59,130,246,0.3);white-space:nowrap}
    .btn-sm{padding:3px 8px;border:none;border-radius:5px;font-size:10px;cursor:pointer;font-weight:600;transition:all .2s}
    .btn-nav{background:rgba(255,255,255,0.08);color:var(--text2);border:1px solid var(--border)}
    .btn-nav:hover{background:rgba(255,255,255,0.15);color:#fff}

    /* === Bottom Action Bar === */
    #action-bar{position:fixed;z-index:15;bottom:16px;left:16px;right:16px;
      display:flex;justify-content:space-between;align-items:center;
      background:rgba(10,14,23,0.85);border:1px solid var(--border);border-radius:18px;padding:8px 18px;
      backdrop-filter:blur(10px)}
    .action-group{display:flex;gap:8px;align-items:center}
    .btn-dice{width:52px;height:52px;border-radius:14px;border:2px solid var(--accent);background:rgba(59,130,246,0.15);
      color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:all .3s;flex-shrink:0}
    .btn-dice:hover{background:rgba(59,130,246,0.3);transform:scale(1.08)}
    .btn-dice:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .btn-dice .dice-num{font-size:26px;font-weight:900}
    .dir-btn{padding:8px 14px;border-radius:10px;border:2px solid var(--green);background:rgba(16,185,129,0.15);
      color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
    .dir-btn:hover{background:rgba(16,185,129,0.35);transform:translateY(-2px)}
    .dice-info{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--accent);background:rgba(59,130,246,0.12);padding:3px 10px;border-radius:8px;font-weight:700;white-space:nowrap}

    /* === Right Panel === */
    #right-panel{position:fixed;z-index:12;top:56px;right:8px;bottom:80px;width:200px;
      display:flex;flex-direction:column;gap:6px;overflow-y:auto;
      pointer-events:auto}
    .panel-card{background:rgba(17,24,39,0.88);border:1px solid var(--border);border-radius:8px;padding:8px;backdrop-filter:blur(8px)}
    .panel-title{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
    .lb-row{display:flex;align-items:center;gap:5px;padding:2px 0;font-size:10px}
    .lb-rank{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;background:var(--bg3);color:var(--text2);flex-shrink:0}
    .t1{background:linear-gradient(135deg,#f59e0b,#f97316);color:#000}.t2{background:#94a3b8;color:#000}.t3{background:#b45309;color:#fff}
    .lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .lb-money{color:var(--yellow);font-weight:600;font-size:9px;flex-shrink:0}
    .building-item{display:flex;align-items:center;gap:4px;padding:3px 0;font-size:10px;border-bottom:1px solid rgba(255,255,255,0.05)}
    .building-item .b-icon{font-size:14px}.building-item .b-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.building-item .b-lv{color:var(--accent);font-weight:700;font-size:9px}

    /* === Game Log (bottom-left, above action bar) === */
    #game-log{position:fixed;z-index:12;bottom:80px;left:12px;width:280px;max-height:150px;
      overflow-y:auto;display:flex;flex-direction:column;gap:2px;pointer-events:auto}
    .log-item{font-size:9px;color:var(--text2);background:rgba(0,0,0,0.55);padding:2px 6px;border-radius:4px;backdrop-filter:blur(4px)}
    .log-item.warn{color:var(--yellow);border-left:2px solid var(--yellow)}
    .log-item.danger{color:var(--red);border-left:2px solid var(--red)}
    .log-item.good{color:var(--green);border-left:2px solid var(--green)}

    /* === Building Action Overlay (above action bar) === */
    #building-overlay{position:fixed;z-index:16;bottom:90px;left:50%;transform:translateX(-50%);
      display:none;flex-direction:column;align-items:center;gap:6px;
      background:rgba(17,24,39,0.92);border:1px solid var(--border);border-radius:12px;padding:12px 18px;
      backdrop-filter:blur(10px);min-width:220px;max-width:340px}
    #building-overlay.show{display:flex}
    .bo-title{font-size:13px;font-weight:700;text-align:center}.bo-desc{font-size:10px;color:var(--text2);text-align:center}
    .bo-effects{display:flex;gap:8px;font-size:10px;font-weight:600;flex-wrap:wrap;justify-content:center}
    .bo-effects .eff{padding:2px 6px;border-radius:4px;background:rgba(16,185,129,0.15);color:var(--green)}
    .btn-use{padding:6px 18px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
    .btn-use-pay{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff}
    .btn-use-pay:hover{transform:scale(1.05)}
    .btn-use-skip{background:rgba(255,255,255,0.08);color:var(--text2);border:1px solid var(--border)}

    /* === Build Modal === */
    #build-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);align-items:center;justify-content:center}
    #build-modal.show{display:flex}
    .modal-content{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;
      width:min(400px, calc(100vw - 32px));max-height:80vh;overflow-y:auto}
    .modal-title{font-size:15px;font-weight:700;margin-bottom:10px}
    .maslow-group{margin-bottom:10px}
    .maslow-label{font-size:10px;font-weight:700;color:var(--text2);padding:3px 0;border-bottom:1px solid var(--border);margin-bottom:4px}
    .build-option{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;cursor:pointer;transition:all .2s;border:1px solid transparent}
    .build-option:hover{background:rgba(255,255,255,0.05);border-color:var(--border)}
    .build-option .bo-icon{font-size:20px;flex-shrink:0}
    .build-option .bo-info{flex:1;min-width:0}
    .build-option .bo-info .name{font-size:12px;font-weight:600}
    .build-option .bo-info .desc{font-size:9px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .build-option .bo-cost{font-weight:700;color:var(--yellow);font-size:11px;flex-shrink:0}
    .btn-close-modal{float:right;background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;padding:4px}

    /* === Dead overlay === */
    #dead-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;flex-direction:column;gap:14px}
    #dead-overlay.show{display:flex}
    .dead-title{font-size:24px;font-weight:900;color:var(--red)}
    .dead-msg{font-size:13px;color:var(--text2);text-align:center;max-width:280px}
    .btn-respawn{padding:10px 30px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--green),#06b6d4);color:#fff;font-size:14px;font-weight:700;cursor:pointer}

    /* === Scrollbar === */
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

    /* === Responsive === */
    @media(max-width:768px){
      #right-panel{display:none}
      #game-log{width:calc(100% - 24px);left:12px;right:12px;max-height:100px}
      .stat-bars{display:none}
      .pos-info,.dice-info{display:none!important}
      #top-bar{padding:6px 10px}
      .logo{font-size:13px}
      #action-bar{padding:6px 10px;bottom:10px;left:10px;right:10px}
      .btn-dice{width:44px;height:44px;font-size:18px}
      .dir-btn{padding:6px 10px;font-size:11px}
      #building-overlay{bottom:70px;min-width:200px;padding:10px 14px}
      .modal-content{width:calc(100vw - 16px);padding:12px}
    }
    @media(min-width:769px) and (max-width:1024px){
      #right-panel{width:170px}
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Top Bar -->
<div id="top-bar">
  <div class="top-left">
    <span class="logo">EchoWorld 3D</span>
    <a href="/" class="btn-sm btn-nav">首页</a>
    <a href="/news" class="btn-sm btn-nav">新闻</a>
    <div class="stat-bars">
      <div class="stat-bar"><span class="label">🍔</span><div class="bar"><div class="fill fill-hunger" id="bar-hunger" style="width:80%"></div></div><span class="val" id="val-hunger">80</span></div>
      <div class="stat-bar"><span class="label">⚡</span><div class="bar"><div class="fill fill-energy" id="bar-energy" style="width:80%"></div></div><span class="val" id="val-energy">80</span></div>
      <div class="stat-bar"><span class="label">😊</span><div class="bar"><div class="fill fill-happy" id="bar-happy" style="width:80%"></div></div><span class="val" id="val-happy">80</span></div>
    </div>
    <div class="pos-info" id="pos-info">加载中...</div>
    <div class="dice-info" id="dice-info">🎲 -</div>
  </div>
  <div class="top-right">
    <div class="money-badge" id="money-badge">0 CC</div>
    <div class="action-badge" id="action-badge">行动 0/8</div>
    <button class="btn-sm btn-nav" onclick="location.href='/login'" id="btn-logout">退出</button>
  </div>
</div>

<!-- Bottom Action Bar -->
<div id="action-bar">
  <div class="action-group">
    <button class="dir-btn" id="btn-left" style="display:none">← 左</button>
    <button class="btn-dice" id="btn-roll" onclick="rollDice()"><span>🎲</span></button>
    <button class="dir-btn" id="btn-right" style="display:none">右 →</button>
  </div>
  <div class="action-group">
    <button class="dir-btn" id="btn-build" style="display:none;border-color:var(--purple);background:rgba(168,85,247,0.15)" onclick="openBuildModal()">🔨 建造</button>
    <button class="dir-btn" id="btn-consume" style="display:none;border-color:var(--orange);background:rgba(249,115,22,0.15)" onclick="useBuilding()">💰 消费</button>
  </div>
</div>

<!-- Right Panel -->
<div id="right-panel">
  <div class="panel-card">
    <div class="panel-title">排行榜</div>
    <div id="leaderboard">-</div>
  </div>
  <div class="panel-card">
    <div class="panel-title">我的建筑</div>
    <div id="my-buildings"><span style="font-size:11px;color:var(--text2)">暂无</span></div>
  </div>
  <div class="panel-card">
    <div class="panel-title">马斯洛需求层次</div>
    <div style="font-size:10px;line-height:1.6;color:var(--text2)">
      <div><span style="color:#4ade80">L1 生理</span> 食物/水/住所</div>
      <div><span style="color:#60a5fa">L2 安全</span> 医疗/药品/储蓄</div>
      <div><span style="color:#fbbf24">L3 社交</span> 茶馆/酒吧/社区</div>
      <div><span style="color:#f97316">L4 尊重</span> 餐厅/酒店/银行</div>
      <div><span style="color:#a855f7">L5 实现</span> 学院/艺术馆/创业</div>
    </div>
  </div>
</div>

<!-- Building Action Overlay -->
<div id="building-overlay">
  <div class="bo-title" id="bo-title"></div>
  <div class="bo-desc" id="bo-desc"></div>
  <div class="bo-effects" id="bo-effects"></div>
  <div style="display:flex;gap:10px">
    <button class="btn-use btn-use-skip" onclick="closeBuildingOverlay()">知道了</button>
  </div>
</div>

<!-- Build Modal -->
<div id="build-modal">
  <div class="modal-content">
    <button class="btn-close-modal" onclick="closeBuildModal()">&times;</button>
    <div class="modal-title">选择建筑类型</div>
    <div id="build-list"></div>
    <div style="margin-top:10px">
      <label style="font-size:11px;color:var(--text2)">自定义名称 (可选)</label>
      <input id="build-custom-name" type="text" placeholder="留空使用默认名" style="width:100%;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:12px;margin-top:4px">
    </div>
  </div>
</div>

<!-- Dead Overlay -->
<div id="dead-overlay">
  <div class="dead-title">角色死亡</div>
  <div class="dead-msg" id="dead-msg">你的生命值已耗尽，损失50%资产。</div>
  <button class="btn-respawn" onclick="respawn()">在起点重生</button>
</div>

<!-- Game Log -->
<div id="game-log"></div>

<!-- Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============ CONFIG ============
const API = location.origin;
const token = localStorage.getItem('echoworld_token');
if (!token) location.href = '/login';
const MASLOW_COLORS = { 1: 0x4ade80, 2: 0x60a5fa, 3: 0xfbbf24, 4: 0xf97316, 5: 0xa855f7 };
const NODE_COLORS = { start: 0x10b981, tax: 0xef4444, welfare: 0x3b82f6, event: 0xfbbf24, intersection: 0x475569, road: 0x283040, lot: 0x1e293b };
const PLAYER_COLORS = ['#22d3ee','#f472b6','#a78bfa','#fb923c','#4ade80','#e879f9','#fbbf24','#38bdf8'];

let currentUser = null, myState = null, myEntity = null, allNodes = [], allPlayers = [];
let buildingCatalog = [], selectedBuildNodeId = null;
let pendingDirections = null;
let myPlayerMesh = null, myPlayerLabel = null;
let isAnimating = false;
const logs = [];

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
}

// ============ THREE.js SCENE ============
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e17);
scene.fog = new THREE.FogExp2(0x0a0e17, 0.018);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 28, 18);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0x334466, 2.0));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(30, 50, 20);
dirLight.castShadow = true;
dirLight.shadow.camera.near = 0.1;
dirLight.shadow.camera.far = 120;
dirLight.shadow.camera.left = -60;
dirLight.shadow.camera.right = 60;
dirLight.shadow.camera.top = 60;
dirLight.shadow.camera.bottom = -60;
dirLight.shadow.mapSize.set(2048, 2048);
scene.add(dirLight);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid
const grid = new THREE.GridHelper(300, 150, 0x1a2332, 0x131b2b);
grid.position.y = 0.01;
scene.add(grid);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.3;
controls.minDistance = 6;
controls.maxDistance = 55;
controls.target.set(0, 0, 0);

// Meshes
let mapMeshGroup = new THREE.Group();
scene.add(mapMeshGroup);
let playerMeshGroup = new THREE.Group();
scene.add(playerMeshGroup);
let directionMeshGroup = new THREE.Group();
scene.add(directionMeshGroup);
let pathMeshGroup = new THREE.Group();
scene.add(pathMeshGroup);

// Raycaster for clicking
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const clickableMeshes = [];

// ============ RENDER FUNCTIONS ============

function renderMap(nodes) {
  // Dispose old
  while (mapMeshGroup.children.length) {
    const m = mapMeshGroup.children[0];
    m.geometry?.dispose();
    m.material?.dispose();
    mapMeshGroup.remove(m);
  }
  clickableMeshes.length = 0;

  for (const node of nodes) {
    let mesh;
    if (node.building) {
      // Building: colored box, height by level
      const tpl = buildingCatalog.find(b => b.type === node.building.templateType);
      const ml = tpl?.maslowLevel || 1;
      const h = 0.6 + node.building.level * 0.5;
      const color = MASLOW_COLORS[ml] || 0x888888;
      const geo = new THREE.BoxGeometry(1.3, h, 1.3);
      const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.15, roughness: 0.4 });
      mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(node.x, h / 2, node.y);
      mesh.castShadow = true;
      mesh.userData = { nodeId: node.id, type: 'building', node };
      clickableMeshes.push(mesh);
    } else if (node.type === 'lot') {
      // Empty lot: flat dashed outline
      const geo = new THREE.BoxGeometry(1.2, 0.05, 1.2);
      const mat = new THREE.MeshStandardMaterial({ color: 0x374151, transparent: true, opacity: 0.3 });
      mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(node.x, 0.03, node.y);
      mesh.userData = { nodeId: node.id, type: 'lot', node };
      clickableMeshes.push(mesh);
    } else {
      // Road/intersection/special
      const isSpecial = ['start', 'tax', 'welfare', 'event'].includes(node.type);
      const isInter = node.type === 'intersection';
      const size = isSpecial ? 1.8 : isInter ? 1.6 : 1.4;
      const height = isSpecial ? 0.12 : 0.06;
      const color = NODE_COLORS[node.type] || NODE_COLORS.road;
      const geo = new THREE.BoxGeometry(size, height, size);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
      mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(node.x, height / 2, node.y);
      mesh.receiveShadow = true;
      mesh.userData = { nodeId: node.id, type: node.type, node };
      clickableMeshes.push(mesh);
    }
    mapMeshGroup.add(mesh);
  }

  // Draw road connections as thin lines
  const lineMat = new THREE.LineBasicMaterial({ color: 0x283040, transparent: true, opacity: 0.4 });
  const nodeMap = new Map(nodes.map(n => [n.id, n]));
  const drawnEdges = new Set();
  for (const node of nodes) {
    for (const cid of node.connections) {
      const key = Math.min(node.id, cid) + '-' + Math.max(node.id, cid);
      if (drawnEdges.has(key)) continue;
      drawnEdges.add(key);
      const cn = nodeMap.get(cid);
      if (!cn) continue;
      const pts = [new THREE.Vector3(node.x, 0.04, node.y), new THREE.Vector3(cn.x, 0.04, cn.y)];
      const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
      const line = new THREE.Line(lineGeo, lineMat);
      mapMeshGroup.add(line);
    }
  }
}

function renderPlayers(players) {
  while (playerMeshGroup.children.length) {
    const m = playerMeshGroup.children[0];
    m.geometry?.dispose();
    m.material?.dispose();
    playerMeshGroup.remove(m);
  }

  const nodeMap = new Map(allNodes.map(n => [n.id, n]));
  for (let i = 0; i < players.length; i++) {
    const p = players[i];
    const node = nodeMap.get(p.nodeId);
    if (!node) continue;
    const isMe = p.entityId === currentUser?.entityId;
    const radius = isMe ? 0.4 : 0.25;
    const pColor = isMe ? 0x22d3ee : parseInt(PLAYER_COLORS[i % PLAYER_COLORS.length].replace('#',''), 16);
    const geo = new THREE.SphereGeometry(radius, 16, 16);
    const mat = new THREE.MeshStandardMaterial({ color: pColor, emissive: pColor, emissiveIntensity: isMe ? 0.6 : 0.2, roughness: 0.3 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(node.x, isMe ? 0.55 : 0.4, node.y);
    mesh.castShadow = true;
    if (isMe) myPlayerMesh = mesh;
    playerMeshGroup.add(mesh);

    // Name label (sprite)
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = isMe ? '#22d3ee' : '#9ca3af';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText((p.name || '?').slice(0, 8), 64, 20);
    const tex = new THREE.CanvasTexture(canvas);
    const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
    const sprite = new THREE.Sprite(spriteMat);
    sprite.scale.set(2, 0.5, 1);
    sprite.position.set(node.x, isMe ? 1.2 : 1.0, node.y);
    if (isMe) myPlayerLabel = sprite;
    playerMeshGroup.add(sprite);
  }
}

function showDirectionArrows(directions) {
  clearDirectionArrows();
  const nodeMap = new Map(allNodes.map(n => [n.id, n]));
  const myNode = myState ? nodeMap.get(myState.nodeId) : null;
  if (!myNode) return;

  for (const d of directions) {
    const dx = d.x - myNode.x, dy = d.y - myNode.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist === 0) continue;

    // Arrow cone
    const geo = new THREE.ConeGeometry(0.3, 0.8, 8);
    const mat = new THREE.MeshStandardMaterial({ color: 0x22d3ee, emissive: 0x22d3ee, emissiveIntensity: 0.6, transparent: true, opacity: 0.8 });
    const arrow = new THREE.Mesh(geo, mat);
    const mx = myNode.x + dx * 0.6, my = myNode.y + dy * 0.6;
    arrow.position.set(mx, 1.2, my);
    // Rotate to point in direction
    const angle = Math.atan2(dx, dy);
    arrow.rotation.set(0, 0, 0);
    arrow.rotation.order = 'YXZ';
    arrow.rotation.y = angle;
    arrow.rotation.x = Math.PI / 2;
    arrow.userData = { directionNodeId: d.nodeId, label: d.label };
    directionMeshGroup.add(arrow);
    clickableMeshes.push(arrow);
  }
}

function clearDirectionArrows() {
  while (directionMeshGroup.children.length) {
    const m = directionMeshGroup.children[0];
    m.geometry?.dispose();
    m.material?.dispose();
    directionMeshGroup.remove(m);
  }
  clickableMeshes.splice(0, clickableMeshes.length, ...clickableMeshes.filter(m => !m.userData?.directionNodeId));
}

/** 逐步动画：玩家棋子沿路径跳跃移动 */
async function animateSteps(pathPoints) {
  isAnimating = true;
  // 清除旧路径标记
  while (pathMeshGroup.children.length) {
    const m = pathMeshGroup.children[0];
    m.geometry?.dispose();
    m.material?.dispose();
    pathMeshGroup.remove(m);
  }

  for (let i = 1; i < pathPoints.length; i++) {
    const to = pathPoints[i];
    // 放一个路径标记点
    const geo = new THREE.SphereGeometry(0.12, 8, 8);
    const mat = new THREE.MeshStandardMaterial({ color: 0x22d3ee, emissive: 0x22d3ee, emissiveIntensity: 0.8, transparent: true, opacity: 0.5 });
    const dot = new THREE.Mesh(geo, mat);
    dot.position.set(to.x, 0.15, to.y);
    pathMeshGroup.add(dot);
    // 移动玩家棋子
    await movePlayerMeshTo(to.x, to.y, 280);
  }
  isAnimating = false;

  // 淡出路径标记
  setTimeout(() => {
    while (pathMeshGroup.children.length) {
      const m = pathMeshGroup.children[0];
      m.geometry?.dispose();
      m.material?.dispose();
      pathMeshGroup.remove(m);
    }
  }, 2000);
}

/** 平滑移动玩家棋子到目标位置 (带跳跃弧线) */
function movePlayerMeshTo(tx, ty, duration) {
  return new Promise(resolve => {
    if (!myPlayerMesh) { resolve(); return; }
    const sx = myPlayerMesh.position.x, sz = myPlayerMesh.position.z;
    const baseY = myPlayerMesh.position.y;
    const start = performance.now();
    function step(now) {
      let t = Math.min((now - start) / duration, 1);
      const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; // ease in-out
      const x = sx + (tx - sx) * ease;
      const z = sz + (ty - sz) * ease;
      const jumpY = baseY + Math.sin(t * Math.PI) * 0.6; // 跳跃弧线
      myPlayerMesh.position.set(x, jumpY, z);
      if (myPlayerLabel) myPlayerLabel.position.set(x, jumpY + 0.65, z);
      // 镜头跟随
      controls.target.set(x, 0, z);
      if (t < 1) requestAnimationFrame(step);
      else {
        myPlayerMesh.position.y = baseY;
        if (myPlayerLabel) myPlayerLabel.position.y = baseY + 0.65;
        resolve();
      }
    }
    requestAnimationFrame(step);
  });
}

// ============ CAMERA ============
function focusCamera(x, y, animate = true) {
  const target = new THREE.Vector3(x, 0, y);
  if (animate) {
    const startTarget = controls.target.clone();
    const startPos = camera.position.clone();
    const endPos = new THREE.Vector3(x, camera.position.y, y + 18);
    let t = 0;
    function anim() {
      t += 0.03;
      if (t > 1) t = 1;
      const ease = t * (2 - t);
      controls.target.lerpVectors(startTarget, target, ease);
      camera.position.lerpVectors(startPos, endPos, ease);
      if (t < 1) requestAnimationFrame(anim);
    }
    anim();
  } else {
    controls.target.copy(target);
    camera.position.set(x, 28, y + 18);
  }
}

// ============ UI UPDATES ============
function updateStats(stats) {
  const h = stats?.hunger ?? 0, e = stats?.energy ?? 0, hp = stats?.happiness ?? 0;
  document.getElementById('bar-hunger').style.width = h + '%';
  document.getElementById('bar-energy').style.width = e + '%';
  document.getElementById('bar-happy').style.width = hp + '%';
  document.getElementById('val-hunger').textContent = h;
  document.getElementById('val-energy').textContent = e;
  document.getElementById('val-happy').textContent = hp;
  // Warning colors
  document.getElementById('bar-hunger').parentElement.parentElement.style.opacity = h <= 20 ? '1' : '0.85';
  document.getElementById('bar-energy').parentElement.parentElement.style.opacity = e <= 15 ? '1' : '0.85';
}

function updateMoney(entity) {
  document.getElementById('money-badge').textContent = (entity?.currency ?? 0).toFixed(0) + ' CC';
}

function updateActions(state) {
  document.getElementById('action-badge').textContent = `行动 ${state?.actionsToday ?? 0}/${state?.maxActions ?? 8}`;
  document.getElementById('btn-roll').disabled = !state?.alive || (state?.actionsToday ?? 0) >= (state?.maxActions ?? 8) || state?.pendingRoll !== null;
}

function updatePosInfo(node) {
  if (!node) return;
  const labels = { start: '起点 🚀', tax: '税务站 💸', welfare: '福利站 🎁', event: '随机事件 🎲', intersection: '十字路口', road: '道路', lot: '空地' };
  let text = labels[node.type] || node.type;
  text += ` (${node.x}, ${node.y})`;
  if (node.building) text = `${node.building.name} ${buildingCatalog.find(b => b.type === node.building.templateType)?.icon || ''} Lv.${node.building.level}`;
  document.getElementById('pos-info').textContent = text;
}

function addLog(msg, type = '') {
  logs.push({ msg, type, time: new Date().toLocaleTimeString() });
  if (logs.length > 50) logs.shift();
  const el = document.getElementById('game-log');
  el.innerHTML = logs.slice(-12).map(l =>
    `<div class="log-item ${l.type}">[${l.time}] ${l.msg}</div>`
  ).join('');
  el.scrollTop = el.scrollHeight;
}

function updateLeaderboard(players) {
  const sorted = [...players].sort((a, b) => (b.money ?? 0) - (a.money ?? 0)).slice(0, 8);
  document.getElementById('leaderboard').innerHTML = sorted.map((p, i) =>
    `<div class="lb-row"><div class="lb-rank ${i===0?'t1':i===1?'t2':i===2?'t3':''}">${i+1}</div><span class="lb-name">${p.name}${p.entityId === currentUser?.entityId ? ' (我)' : ''}</span><span class="lb-money">${(p.money ?? 0).toFixed(0)} CC</span></div>`
  ).join('') || '<span style="font-size:11px;color:var(--text2)">暂无</span>';
}

function updateMyBuildings(nodes) {
  const myBuildings = nodes.filter(n => n.building?.ownerId === currentUser?.entityId);
  document.getElementById('my-buildings').innerHTML = myBuildings.map(n => {
    const tpl = buildingCatalog.find(b => b.type === n.building.templateType);
    return `<div class="building-item"><span class="b-icon">${tpl?.icon || '?'}</span><span class="b-name">${n.building.name}</span><span class="b-lv">Lv.${n.building.level}</span></div>`;
  }).join('') || '<span style="font-size:11px;color:var(--text2)">暂无</span>';
}

function showBuildingOverlay(node) {
  const b = node.building;
  if (!b || b.ownerId === currentUser?.entityId) return;
  const tpl = buildingCatalog.find(t => t.type === b.templateType);
  if (!tpl) return;
  const lvMult = 1 + (b.level - 1) * 0.3;
  const fee = Math.floor(tpl.baseFee * lvMult);
  document.getElementById('bo-title').textContent = `${tpl.icon} ${b.name} (Lv.${b.level}) - ${b.ownerName}`;
  document.getElementById('bo-desc').textContent = `${tpl.description} | 费用: ${fee} CC`;
  const effectsHtml = Object.entries(tpl.effects).map(([k, v]) => {
    const eMult = 1 + (b.level - 1) * 0.2;
    const names = { hunger: '🍔', energy: '⚡', happiness: '😊' };
    return `<span class="eff">${names[k] || k} +${Math.floor(v * eMult)}</span>`;
  }).join('');
  document.getElementById('bo-effects').innerHTML = effectsHtml;
  document.getElementById('btn-use-building').textContent = `消费 ${fee} CC`;
  document.getElementById('building-overlay').classList.add('show');
}

function closeBuildingOverlay() {
  document.getElementById('building-overlay').classList.remove('show');
}

// ============ API CALLS ============

async function fetchMe() {
  try {
    const [meRes, userRes] = await Promise.all([
      fetch(API + '/api/world/me', { headers: authHeaders() }),
      fetch(API + '/api/auth/me', { headers: authHeaders() }),
    ]);
    if (!meRes.ok) throw new Error('me failed');
    const meData = await meRes.json();
    currentUser = await userRes.json();
    myState = meData.state;
    myEntity = meData.entity;
    updateStats(myState);
    updateMoney(myEntity);
    updateActions(myState);
    updatePosInfo(meData.node);

    // Check death
    if (!myState.alive) {
      document.getElementById('dead-overlay').classList.add('show');
    }

    // Check building on current tile - show consume in action bar
    document.getElementById('btn-consume').style.display = 'none';
    if (meData.node?.building && meData.node.building.ownerId !== currentUser.entityId) {
      showBuildingOverlay(meData.node);
      document.getElementById('btn-consume').style.display = 'block';
      const tpl = buildingCatalog.find(t => t.type === meData.node.building.templateType);
      const lvMult = 1 + (meData.node.building.level - 1) * 0.3;
      const fee = Math.floor((tpl?.baseFee || 0) * lvMult);
      document.getElementById('btn-consume').textContent = `💰 ${fee} CC`;
    }

    // Show build button if near empty lots
    const hasNearbyLots = meData.nearbyLots && meData.nearbyLots.length > 0;
    document.getElementById('btn-build').style.display = hasNearbyLots ? 'block' : 'none';

    return meData;
  } catch (e) {
    console.error('fetchMe error:', e);
    addLog('加载状态失败', 'danger');
  }
}

async function fetchMap() {
  try {
    const node = myState ? allNodes.find(n => n.id === myState.nodeId) : null;
    const cx = node?.x ?? 0, cy = node?.y ?? 0;
    const res = await fetch(API + `/api/world/map?cx=${cx}&cy=${cy}&r=30`, { headers: authHeaders() });
    const data = await res.json();
    allNodes = data.nodes;
    allPlayers = data.players;
    renderMap(allNodes);
    renderPlayers(allPlayers);
    updateLeaderboard(allPlayers);
    updateMyBuildings(allNodes);
  } catch (e) {
    console.error('fetchMap error:', e);
  }
}

async function fetchCatalog() {
  try {
    const res = await fetch(API + '/api/world/buildings-catalog');
    buildingCatalog = await res.json();
  } catch (e) { console.error(e); }
}

// ============ GAME ACTIONS ============

/** 显示左右方向按钮 */
function showDirButtons(directions) {
  const btnLeft = document.getElementById('btn-left');
  const btnRight = document.getElementById('btn-right');
  btnLeft.style.display = 'none';
  btnRight.style.display = 'none';

  if (directions.length >= 1) {
    btnLeft.style.display = 'block';
    btnLeft.textContent = directions[0].label;
    btnLeft.onclick = () => chooseDirection(directions[0].nodeId);
  }
  if (directions.length >= 2) {
    btnRight.style.display = 'block';
    btnRight.textContent = directions[1].label;
    btnRight.onclick = () => chooseDirection(directions[1].nodeId);
  }

  showDirectionArrows(directions);
}

/** 隐藏方向按钮 */
function hideDirButtons() {
  document.getElementById('btn-left').style.display = 'none';
  document.getElementById('btn-right').style.display = 'none';
  clearDirectionArrows();
}

window.rollDice = async function() {
  if (isAnimating) return;
  try {
    const res = await fetch(API + '/api/world/roll', { method: 'POST', headers: authHeaders() });
    if (!res.ok) { const err = await res.json(); addLog(err.error, 'warn'); return; }
    const data = await res.json();

    addLog(`掷出 ${data.roll} 点`, 'good');

    // Show dice number on button and in top bar
    const btn = document.getElementById('btn-roll');
    btn.innerHTML = `<span class="dice-num">${data.roll}</span>`;
    btn.disabled = true;
    document.getElementById('dice-info').textContent = `🎲 ${data.roll} 步`;

    // Hide build/consume during movement
    document.getElementById('btn-build').style.display = 'none';
    document.getElementById('btn-consume').style.display = 'none';
    closeBuildingOverlay();

    // Show direction buttons
    showDirButtons(data.directions);

  } catch (e) {
    addLog('掷骰子失败', 'danger');
  }
};

async function chooseDirection(directionNodeId) {
  try {
    hideDirButtons();

    const res = await fetch(API + '/api/world/move', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ directionNodeId }),
    });
    if (!res.ok) { const err = await res.json(); addLog(err.error, 'warn'); return; }
    const data = await res.json();

    // 逐步动画
    await animateSteps(data.path);

    // 更新位置信息
    updatePosInfo(data.finalNode);

    if (data.fork) {
      // 遇到岔路口，等待玩家选择
      addLog(`到达岔路口，剩余 ${data.remainingSteps} 步`, 'warn');
      document.getElementById('dice-info').textContent = `🎲 剩余 ${data.remainingSteps} 步`;
      myState = data.state;
      showDirButtons(data.directions);
      return;
    }

    // === 移动完成 ===
    myState = data.state;
    myEntity = data.entity;
    updateStats(data.stats);
    updateMoney(data.entity);
    updateActions(data.state);

    // Log messages
    for (const msg of data.messages) {
      const type = msg.includes('警告') || msg.includes('⚠') ? 'warn' : msg.includes('死亡') || msg.includes('损失') ? 'danger' : msg.includes('获得') || msg.includes('福利') ? 'good' : '';
      addLog(msg, type);
    }

    // Reset dice button
    document.getElementById('btn-roll').innerHTML = '<span>🎲</span>';
    document.getElementById('dice-info').textContent = '🎲 -';

    // Check death
    if (!data.stats.alive) {
      document.getElementById('dead-overlay').classList.add('show');
    }

    // 到达后显示动作按钮：建造 / 消费
    closeBuildingOverlay();
    document.getElementById('btn-consume').style.display = 'none';
    if (data.finalNode.building && data.finalNode.building.ownerId !== currentUser?.entityId) {
      showBuildingOverlay(data.finalNode);
      document.getElementById('btn-consume').style.display = 'block';
      const tpl = buildingCatalog.find(t => t.type === data.finalNode.building.templateType);
      const lvMult = 1 + (data.finalNode.building.level - 1) * 0.3;
      const fee = Math.floor((tpl?.baseFee || 0) * lvMult);
      document.getElementById('btn-consume').textContent = `💰 ${fee} CC`;
    }

    // Refresh map
    await fetchMap();
    await fetchMe();

  } catch (e) {
    addLog('移动失败', 'danger');
  }
}

window.useBuilding = async function() {
  try {
    const res = await fetch(API + '/api/world/use-building', { method: 'POST', headers: authHeaders() });
    if (!res.ok) { const err = await res.json(); addLog(err.error || '使用失败', 'warn'); return; }
    const data = await res.json();

    for (const msg of data.messages) {
      const type = msg.includes('升级') ? 'good' : '';
      addLog(msg, type);
    }

    updateStats(data.stats);
    updateMoney(data.entity);
    closeBuildingOverlay();
    document.getElementById('btn-consume').style.display = 'none';
    await fetchMap();

  } catch (e) {
    addLog('消费失败', 'danger');
  }
};

window.openBuildModal = function() {
  const modal = document.getElementById('build-modal');
  const list = document.getElementById('build-list');
  const groups = {};
  const levelNames = { 1: 'L1 生理需求', 2: 'L2 安全需求', 3: 'L3 社交需求', 4: 'L4 尊重需求', 5: 'L5 自我实现' };
  const levelColors = { 1: '#4ade80', 2: '#60a5fa', 3: '#fbbf24', 4: '#f97316', 5: '#a855f7' };

  for (const b of buildingCatalog) {
    if (!groups[b.maslowLevel]) groups[b.maslowLevel] = [];
    groups[b.maslowLevel].push(b);
  }

  list.innerHTML = '';
  for (const [lvl, items] of Object.entries(groups).sort((a, b) => Number(a[0]) - Number(b[0]))) {
    const group = document.createElement('div');
    group.className = 'maslow-group';
    group.innerHTML = `<div class="maslow-label" style="color:${levelColors[lvl]}">${levelNames[lvl]}</div>`;
    for (const b of items) {
      const opt = document.createElement('div');
      opt.className = 'build-option';
      opt.innerHTML = `<span class="bo-icon">${b.icon}</span><div class="bo-info"><div class="name">${b.name}</div><div class="desc">${b.description}${b.baseFee > 0 ? ` | 使用费: ${b.baseFee} CC` : ''}</div></div><span class="bo-cost">${b.cost} CC</span>`;
      opt.onclick = () => doBuild(b.type);
      group.appendChild(opt);
    }
    list.appendChild(group);
  }
  modal.classList.add('show');
};

window.closeBuildModal = function() {
  document.getElementById('build-modal').classList.remove('show');
};

async function doBuild(templateType) {
  try {
    // Find nearest empty lot from current position
    const meRes = await fetch(API + '/api/world/me', { headers: authHeaders() });
    const meData = await meRes.json();
    const lots = meData.nearbyLots;
    if (!lots || lots.length === 0) { addLog('附近没有空地', 'warn'); return; }

    const nodeId = lots[0].id;
    const customName = document.getElementById('build-custom-name').value.trim() || undefined;

    const res = await fetch(API + '/api/world/build', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ nodeId, templateType, customName }),
    });
    if (!res.ok) { const err = await res.json(); addLog(err.error || '建造失败', 'warn'); return; }
    const data = await res.json();

    addLog(data.message, 'good');
    updateMoney(data.entity);
    closeBuildModal();
    await fetchMap();
    await fetchMe();

  } catch (e) {
    addLog('建造失败', 'danger');
  }
}

window.respawn = async function() {
  try {
    const res = await fetch(API + '/api/world/respawn', { method: 'POST', headers: authHeaders() });
    if (!res.ok) return;
    const data = await res.json();

    document.getElementById('dead-overlay').classList.remove('show');
    myState = data.state;
    updateStats(data.state);
    updateMoney(data.entity);
    updateActions(data.state);
    addLog(data.message, 'good');

    const node = allNodes.find(n => n.id === data.state.nodeId);
    if (node) focusCamera(node.x, node.y);

    await fetchMap();

  } catch (e) {
    addLog('重生失败', 'danger');
  }
};

// ============ CLICK HANDLER ============
renderer.domElement.addEventListener('click', (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects([...directionMeshGroup.children, ...mapMeshGroup.children]);
  if (intersects.length > 0) {
    const obj = intersects[0].object;
    // Direction arrow click
    if (obj.userData?.directionNodeId) {
      chooseDirection(obj.userData.directionNodeId);
      return;
    }
    // Node click
    if (obj.userData?.node) {
      const node = obj.userData.node;
      updatePosInfo(node);
      if (node.building && node.building.ownerId !== currentUser?.entityId) {
        showBuildingOverlay(node);
      }
    }
  }
});

// ============ RESIZE ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============ ANIMATION LOOP ============
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Pulsing direction arrows
  for (const arrow of directionMeshGroup.children) {
    arrow.position.y = 1.2 + Math.sin(t * 3) * 0.15;
    if (arrow.material) arrow.material.opacity = 0.5 + Math.sin(t * 4) * 0.3;
  }

  controls.update();
  renderer.render(scene, camera);
}

// ============ INIT ============
async function init() {
  addLog('正在连接 EchoWorld...');
  await fetchCatalog();
  const meData = await fetchMe();
  await fetchMap();

  if (meData) {
    const node = allNodes.find(n => n.id === myState?.nodeId);
    if (node) focusCamera(node.x, node.y, false);
    addLog(`欢迎回来，${currentUser?.username || '玩家'}！`, 'good');
  }

  // Auto refresh
  setInterval(async () => {
    await fetchMe();
    await fetchMap();
  }, 10000);
}

animate();
init();
