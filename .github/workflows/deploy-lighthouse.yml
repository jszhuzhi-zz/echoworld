name: Deploy to Lighthouse Server

on:
  push:
    branches:
      - claude/ai-agent-commerce-world-U3fxB
    paths-ignore:
      - 'DEPLOY_INFO.txt'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
      SERVER_HOST: 129.211.14.208
      SERVER_PORT: 3000
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Deploy to server
        run: |
          # Decode credentials
          SSH_PASS=$(echo 'enNoTGlnaHQyMDI1bWltYQ==' | base64 -d)
          ZHIPU_KEY=$(echo 'ZmRhZmRkMjEwNzVmNDg0OThlZTQxNjFiZjdkZWFlMzcuT3VoUW9tNkd1aXJ4ZzRxNQ==' | base64 -d)

          # Install sshpass
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          # SSH options
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"

          echo "=== Testing SSH connection ==="
          sshpass -p "$SSH_PASS" ssh $SSH_OPTS root@$SERVER_HOST "echo 'SSH connection OK'" 2>&1 | tee -a /tmp/deploy.log

          echo "=== Deploying to server ==="
          sshpass -p "$SSH_PASS" ssh $SSH_OPTS root@$SERVER_HOST bash -s -- "$ZHIPU_KEY" "$SERVER_PORT" << 'DEPLOY_SCRIPT'
          set -e
          ZHIPU_KEY="$1"
          PORT="$2"
          APP_DIR="/opt/echoworld"
          BRANCH="claude/ai-agent-commerce-world-U3fxB"

          echo "=== EchoWorld Lighthouse Deploy ==="

          # 1. Install Node.js if needed
          if ! command -v node &> /dev/null || [[ "$(node -v | cut -d. -f1 | tr -d v)" -lt 18 ]]; then
            echo "[1] Installing Node.js 20..."
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y nodejs
          else
            echo "[1] Node.js: $(node -v)"
          fi

          # 2. Install PM2
          if ! command -v pm2 &> /dev/null; then
            echo "[2] Installing PM2..."
            npm install -g pm2
          else
            echo "[2] PM2: $(pm2 -v)"
          fi

          # 3. Install git if needed
          if ! command -v git &> /dev/null; then
            apt-get install -y git
          fi

          # 4. Clone or update code
          echo "[3] Fetching code..."
          if [ -d "$APP_DIR/.git" ]; then
            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
          else
            rm -rf "$APP_DIR"
            git clone -b "$BRANCH" https://github.com/jszhuzhi-zz/echoworld.git "$APP_DIR"
            cd "$APP_DIR"
          fi

          # 5. Build
          echo "[4] Installing dependencies..."
          npm ci --omit=dev
          npm ci
          echo "[5] Building..."
          npm run build

          # 6. Start/restart
          echo "[6] Starting service..."
          pm2 delete echoworld 2>/dev/null || true
          PORT=$PORT ZHIPU_API_KEY="$ZHIPU_KEY" ZHIPU_MODEL="glm-4-flash" \
            pm2 start dist/index.js --name echoworld --update-env

          pm2 save
          pm2 startup systemd -u root --hp /root 2>/dev/null || true

          # 7. Open firewall (iptables level)
          iptables -I INPUT -p tcp --dport $PORT -j ACCEPT 2>/dev/null || true

          echo ""
          echo "=== Deploy Complete ==="
          pm2 status
          echo "URL: http://$(curl -s ifconfig.me 2>/dev/null || echo '129.211.14.208'):$PORT"

          # Quick test
          sleep 3
          curl -s http://localhost:$PORT/api/world/time && echo " [API OK]" || echo " [API not ready yet]"
          DEPLOY_SCRIPT

          echo "=== SSH deploy finished ===" | tee -a /tmp/deploy.log

      - name: Verify deployment
        run: |
          echo "Waiting 15s for server to fully start..."
          sleep 15
          echo "Testing http://$SERVER_HOST:$SERVER_PORT/api/world/time ..."
          RESULT=$(curl -sf --max-time 15 http://$SERVER_HOST:$SERVER_PORT/api/world/time 2>&1) && {
            echo "DEPLOY_STATUS=SUCCESS" >> $GITHUB_ENV
            echo "Server response: $RESULT"
          } || {
            echo "DEPLOY_STATUS=UNREACHABLE" >> $GITHUB_ENV
            echo "Server not reachable externally."
            echo "Please open port $SERVER_PORT (TCP) in Lighthouse firewall settings."
          }

      - name: Save deployment info
        if: always()
        run: |
          {
            echo "===== EchoWorld 部署信息 ====="
            echo "部署时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Commit: ${{ github.sha }}"
            echo "部署目标: 轻量服务器 $SERVER_HOST:$SERVER_PORT"
            echo "访问地址: http://$SERVER_HOST:$SERVER_PORT"
            echo "部署状态: ${DEPLOY_STATUS:-UNKNOWN}"
            echo ""
            echo "--- 部署日志 ---"
            cat /tmp/deploy.log 2>/dev/null || echo "无日志"
            echo ""
            if [ "${DEPLOY_STATUS}" != "SUCCESS" ]; then
              echo "提示: 如果无法访问，请在腾讯云轻量服务器控制台开放 $SERVER_PORT 端口 (TCP)"
              echo "防火墙: https://console.cloud.tencent.com/lighthouse/instance/detail?id=lhins-fa84ogo8"
            fi
          } > DEPLOY_INFO.txt

          cat DEPLOY_INFO.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DEPLOY_INFO.txt
          git diff --staged --quiet || git commit -m "ci: update deployment info [skip ci]"
          git push origin claude/ai-agent-commerce-world-U3fxB || true
