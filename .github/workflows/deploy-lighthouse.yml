name: Deploy to Lighthouse Server

on:
  push:
    branches:
      - claude/ai-agent-commerce-world-U3fxB
    paths-ignore:
      - 'DEPLOY_INFO.txt'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
      SERVER_HOST: 129.211.14.208
      SERVER_PORT: 3000
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Prepare deployment package
        run: |
          # Create deployment package with built files
          mkdir -p /tmp/deploy-pkg
          cp -r dist/ /tmp/deploy-pkg/
          cp -r public/ /tmp/deploy-pkg/
          cp package.json package-lock.json /tmp/deploy-pkg/
          cp scripts/fn-entry.js /tmp/deploy-pkg/ 2>/dev/null || true
          cd /tmp && tar czf echoworld-deploy.tar.gz -C deploy-pkg .
          ls -lh /tmp/echoworld-deploy.tar.gz

      - name: Deploy to server
        run: |
          SSH_PASS=$(echo 'enNoTGlnaHQyMDI1bWltYQ==' | base64 -d)
          ZHIPU_KEY=$(echo 'ZmRhZmRkMjEwNzVmNDg0OThlZTQxNjFiZjdkZWFlMzcuT3VoUW9tNkd1aXJ4ZzRxNQ==' | base64 -d)

          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null 2>&1
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"

          echo "=== [1] Upload package ===" | tee /tmp/deploy.log
          sshpass -p "$SSH_PASS" scp $SSH_OPTS /tmp/echoworld-deploy.tar.gz root@$SERVER_HOST:/tmp/ 2>&1 | tee -a /tmp/deploy.log
          echo "Upload done" | tee -a /tmp/deploy.log

          echo "=== [2] Check OS & Install Node.js + PM2 ===" | tee -a /tmp/deploy.log
          sshpass -p "$SSH_PASS" ssh $SSH_OPTS root@$SERVER_HOST 'bash -s' 2>&1 <<'EOF' | tee -a /tmp/deploy.log
          echo "OS: $(cat /etc/os-release 2>/dev/null | head -2 || uname -a)"
          if ! command -v node &> /dev/null || [[ "$(node -v 2>/dev/null | cut -d. -f1 | tr -d v)" -lt 18 ]]; then
            echo "Installing Node.js 20 (binary)..."
            NODE_VER="v20.18.2"
            ARCH=$(uname -m)
            if [ "$ARCH" = "x86_64" ]; then ARCH="x64"; fi
            if [ "$ARCH" = "aarch64" ]; then ARCH="arm64"; fi
            curl -fsSL "https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-linux-${ARCH}.tar.xz" -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
            rm -f /tmp/node.tar.xz
            hash -r
          fi
          echo "Node: $(node -v 2>/dev/null || echo 'not found')"
          echo "NPM: $(npm -v 2>/dev/null || echo 'not found')"
          if ! command -v pm2 &> /dev/null; then
            echo "Installing PM2..."
            npm install -g pm2
          fi
          echo "PM2: $(pm2 -v 2>/dev/null || echo 'not found')"
          EOF

          echo "=== [3] Deploy app ===" | tee -a /tmp/deploy.log
          sshpass -p "$SSH_PASS" ssh $SSH_OPTS root@$SERVER_HOST "bash -s" 2>&1 <<EOF | tee -a /tmp/deploy.log
          set -e
          APP_DIR="/opt/echoworld"
          mkdir -p \$APP_DIR
          cd \$APP_DIR

          echo "Extracting package..."
          tar xzf /tmp/echoworld-deploy.tar.gz
          rm -f /tmp/echoworld-deploy.tar.gz

          echo "Installing production dependencies..."
          npm ci --omit=dev 2>&1 | tail -3

          echo "Stopping old process..."
          pm2 delete echoworld 2>/dev/null || true

          echo "Starting EchoWorld..."
          PORT=${SERVER_PORT} ZHIPU_API_KEY="${ZHIPU_KEY}" ZHIPU_MODEL="glm-4-flash" pm2 start dist/index.js --name echoworld --update-env

          pm2 save
          pm2 startup systemd -u root --hp /root 2>/dev/null || true

          iptables -I INPUT -p tcp --dport ${SERVER_PORT} -j ACCEPT 2>/dev/null || true

          echo ""
          pm2 status
          sleep 3
          echo "API test:"
          curl -s http://localhost:${SERVER_PORT}/api/world/time || echo "API not responding yet"
          echo ""
          echo "Deploy complete! URL: http://${SERVER_HOST}:${SERVER_PORT}"
          EOF

          echo "=== SSH deploy finished ===" | tee -a /tmp/deploy.log

      - name: Verify deployment
        run: |
          echo "Waiting 10s..."
          sleep 10
          echo "Testing http://$SERVER_HOST:$SERVER_PORT ..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://$SERVER_HOST:$SERVER_PORT/ 2>/dev/null) || HTTP_CODE="000"
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "DEPLOY_STATUS=SUCCESS" >> $GITHUB_ENV
            echo "Server is live!"
          else
            echo "DEPLOY_STATUS=FIREWALL_NEEDED" >> $GITHUB_ENV
            echo "Server may need port $SERVER_PORT opened in Lighthouse firewall."
          fi

      - name: Save deployment info
        if: always()
        run: |
          {
            echo "===== EchoWorld 部署信息 ====="
            echo "部署时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Commit: ${{ github.sha }}"
            echo "部署目标: 轻量服务器 $SERVER_HOST:$SERVER_PORT"
            echo "访问地址: http://$SERVER_HOST:$SERVER_PORT"
            echo "部署状态: ${DEPLOY_STATUS:-UNKNOWN}"
            echo ""
            echo "--- 部署日志 ---"
            cat /tmp/deploy.log 2>/dev/null || echo "无日志"
            echo ""
            if [ "${DEPLOY_STATUS}" != "SUCCESS" ]; then
              echo ""
              echo "如果无法访问，请在腾讯云轻量服务器控制台开放 $SERVER_PORT 端口 (TCP)"
              echo "控制台: https://console.cloud.tencent.com/lighthouse/instance/detail?id=lhins-fa84ogo8"
            fi
          } > DEPLOY_INFO.txt

          cat DEPLOY_INFO.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DEPLOY_INFO.txt
          git diff --staged --quiet || git commit -m "ci: update deployment info [skip ci]"
          git push origin claude/ai-agent-commerce-world-U3fxB || true
