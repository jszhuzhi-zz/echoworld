name: Deploy to Tencent CloudBase

on:
  workflow_dispatch:
    inputs:
      tcb_secret_id:
        description: '腾讯云 SecretId'
        required: true
        type: string
      tcb_secret_key:
        description: '腾讯云 SecretKey'
        required: true
        type: string
      zhipu_api_key:
        description: '智谱 API Key'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login to CloudBase
        run: tcb login --apiKeyId "${{ inputs.tcb_secret_id }}" --apiKey "${{ inputs.tcb_secret_key }}"

      - name: Deploy to CloudBase
        run: tcb framework deploy
        env:
          ZHIPU_API_KEY: ${{ inputs.zhipu_api_key }}
