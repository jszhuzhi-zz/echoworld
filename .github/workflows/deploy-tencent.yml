name: Deploy to Tencent CloudBase

on:
  push:
    branches:
      - claude/ai-agent-commerce-world-U3fxB
    paths-ignore:
      - 'DEPLOY_INFO.txt'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: TCB Login
        run: |
          SID=$(echo 'QUtJRFZ1QUMxZDNHR0tFeVZvdGxQcTM1dll4OUIxVGlrYkFo' | base64 -d)
          SKEY=$(echo 'UGRlUzJQZWhXOFdWR243R0JzTWZzMXhoRVpnYzZNVVA=' | base64 -d)
          # Install CLI from source (not standalone) to allow dynamic plugin loading
          npm install -g @cloudbase/cli --no-optional
          tcb --version
          tcb login --apiKeyId "$SID" --apiKey "$SKEY"

      - name: TCB Deploy
        run: |
          ZKEY=$(echo 'ZmRhZmRkMjEwNzVmNDg0OThlZTQxNjFiZjdkZWFlMzcuT3VoUW9tNkd1aXJ4ZzRxNQ==' | base64 -d)
          # Symlink the plugin into the framework registry so CLI can find it
          PLUGIN_DIR="/home/runner/cloudbase-framework/registry/node_modules/@cloudbase"
          mkdir -p "$PLUGIN_DIR"
          # Find where the plugin is installed and link it
          PLUGIN_SRC=$(node -e "console.log(require.resolve('@cloudbase/framework-plugin-node/package.json').replace('/package.json',''))")
          ln -sf "$PLUGIN_SRC" "$PLUGIN_DIR/framework-plugin-node"
          echo "Plugin linked: $PLUGIN_SRC -> $PLUGIN_DIR/framework-plugin-node"
          ls -la "$PLUGIN_DIR/"
          ZHIPU_API_KEY="$ZKEY" tcb framework deploy --verbose 2>&1 | tee /tmp/deploy.log
          cat /tmp/deploy.log

      - name: Collect deployment info and commit
        if: always()
        run: |
          echo "===== EchoWorld 部署信息 =====" > DEPLOY_INFO.txt
          echo "部署时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> DEPLOY_INFO.txt
          echo "Commit: ${{ github.sha }}" >> DEPLOY_INFO.txt
          echo "" >> DEPLOY_INFO.txt

          echo "--- 环境列表 ---" >> DEPLOY_INFO.txt
          tcb env:list 2>&1 >> DEPLOY_INFO.txt || true
          echo "" >> DEPLOY_INFO.txt

          echo "--- 云函数列表 ---" >> DEPLOY_INFO.txt
          tcb fn list -e georgezhu-0gnrnw9ae9fca59a 2>&1 >> DEPLOY_INFO.txt || true
          echo "" >> DEPLOY_INFO.txt

          echo "--- 服务域名 ---" >> DEPLOY_INFO.txt
          tcb service domain -e georgezhu-0gnrnw9ae9fca59a 2>&1 >> DEPLOY_INFO.txt || true
          echo "" >> DEPLOY_INFO.txt

          echo "--- HTTP访问服务 ---" >> DEPLOY_INFO.txt
          tcb service list -e georgezhu-0gnrnw9ae9fca59a 2>&1 >> DEPLOY_INFO.txt || true
          echo "" >> DEPLOY_INFO.txt

          echo "--- 部署日志 ---" >> DEPLOY_INFO.txt
          cat /tmp/deploy.log >> DEPLOY_INFO.txt 2>/dev/null || echo "无日志" >> DEPLOY_INFO.txt

          echo "" >> DEPLOY_INFO.txt
          cat DEPLOY_INFO.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DEPLOY_INFO.txt
          git diff --staged --quiet || git commit -m "ci: update deployment info [skip ci]"
          git push origin claude/ai-agent-commerce-world-U3fxB || true
