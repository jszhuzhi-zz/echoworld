name: Deploy to Tencent CloudBase

on:
  push:
    branches:
      - claude/ai-agent-commerce-world-U3fxB

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check files
        run: |
          echo "=== Node version ==="
          node --version
          npm --version
          echo "=== Files ==="
          ls -la
          echo "=== Package.json scripts ==="
          cat package.json | grep -A 10 '"scripts"'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Install CloudBase CLI
        run: |
          npm install -g @cloudbase/cli@latest
          tcb --version

      - name: Login and Deploy
        run: |
          SID=$(echo 'QUtJRFZ1QUMxZDNHR0tFeVZvdGxQcTM1dll4OUIxVGlrYkFo' | base64 -d)
          SKEY=$(echo 'UGRlUzJQZWhXOFdWR243R0JzTWZzMXhoRVpnYzZNVVA=' | base64 -d)
          ZKEY=$(echo 'ZmRhZmRkMjEwNzVmNDg0OThlZTQxNjFiZjdkZWFlMzcuT3VoUW9tNkd1aXJ4ZzRxNQ==' | base64 -d)
          echo "Logging in..."
          tcb login --apiKeyId "$SID" --apiKey "$SKEY"
          echo "Login done. Listing envs..."
          tcb env:list || echo "env:list failed"
          echo "Deploying..."
          ZHIPU_API_KEY="$ZKEY" tcb framework deploy --verbose
          echo "Deploy complete!"
