name: Deploy to Tencent CloudBase

on:
  push:
    branches:
      - claude/ai-agent-commerce-world-U3fxB

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Install CloudBase CLI
        run: |
          npm install -g @cloudbase/cli@latest
          tcb --version

      - name: TCB Login
        id: login
        run: |
          SID=$(echo 'QUtJRFZ1QUMxZDNHR0tFeVZvdGxQcTM1dll4OUIxVGlrYkFo' | base64 -d)
          SKEY=$(echo 'UGRlUzJQZWhXOFdWR243R0JzTWZzMXhoRVpnYzZNVVA=' | base64 -d)
          echo "Attempting login..."
          tcb login --apiKeyId "$SID" --apiKey "$SKEY" 2>&1 || true
          echo "Login step finished"

      - name: TCB Env List
        run: tcb env:list 2>&1 || echo "env:list failed - login may have failed"

      - name: TCB Deploy
        run: |
          ZKEY=$(echo 'ZmRhZmRkMjEwNzVmNDg0OThlZTQxNjFiZjdkZWFlMzcuT3VoUW9tNkd1aXJ4ZzRxNQ==' | base64 -d)
          echo "Starting deploy..."
          ZHIPU_API_KEY="$ZKEY" tcb framework deploy --verbose 2>&1
          echo "Deploy finished!"
