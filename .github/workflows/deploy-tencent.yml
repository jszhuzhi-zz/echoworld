name: Deploy to Tencent CloudBase

on:
  push:
    branches:
      - claude/ai-agent-commerce-world-U3fxB

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Install CloudBase CLI
        run: |
          npm install -g @cloudbase/cli@latest
          tcb --version

      - name: TCB Login
        run: |
          SID=$(echo 'QUtJRFZ1QUMxZDNHR0tFeVZvdGxQcTM1dll4OUIxVGlrYkFo' | base64 -d)
          SKEY=$(echo 'UGRlUzJQZWhXOFdWR243R0JzTWZzMXhoRVpnYzZNVVA=' | base64 -d)
          tcb login --apiKeyId "$SID" --apiKey "$SKEY"

      - name: TCB Deploy
        run: |
          ZKEY=$(echo 'ZmRhZmRkMjEwNzVmNDg0OThlZTQxNjFiZjdkZWFlMzcuT3VoUW9tNkd1aXJ4ZzRxNQ==' | base64 -d)
          ZHIPU_API_KEY="$ZKEY" tcb framework deploy --verbose 2>&1 | tee /tmp/deploy.log
          cat /tmp/deploy.log

      - name: Get deployment info
        if: always()
        run: |
          mkdir -p deploy-info
          echo "=== Environment Info ===" > deploy-info/result.txt
          tcb env:list 2>&1 >> deploy-info/result.txt || true
          echo "" >> deploy-info/result.txt
          echo "=== Function List ===" >> deploy-info/result.txt
          tcb fn list -e georgezhu-0gnrnw9ae9fca59a 2>&1 >> deploy-info/result.txt || true
          echo "" >> deploy-info/result.txt
          echo "=== Service Domain ===" >> deploy-info/result.txt
          tcb service domain -e georgezhu-0gnrnw9ae9fca59a 2>&1 >> deploy-info/result.txt || true
          echo "" >> deploy-info/result.txt
          echo "=== Deploy Log ===" >> deploy-info/result.txt
          cat /tmp/deploy.log >> deploy-info/result.txt 2>/dev/null || echo "No deploy log" >> deploy-info/result.txt
          echo "" >> deploy-info/result.txt
          echo "=== Access URLs ===" >> deploy-info/result.txt
          echo "Cloud Function: https://georgezhu-0gnrnw9ae9fca59a.service.tcloudbase.com/echoworld" >> deploy-info/result.txt
          echo "Env Console: https://console.cloud.tencent.com/tcb/env/index?envId=georgezhu-0gnrnw9ae9fca59a" >> deploy-info/result.txt

      - name: Upload deployment info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-info
          path: deploy-info/
          retention-days: 7
