name: Deploy to Tencent CloudBase

on:
  push:
    branches:
      - claude/ai-agent-commerce-world-U3fxB
    paths-ignore:
      - 'DEPLOY_INFO.txt'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Decode credentials
        id: creds
        run: |
          echo "sid=$(echo 'QUtJRFZ1QUMxZDNHR0tFeVZvdGxQcTM1dll4OUIxVGlrYkFo' | base64 -d)" >> $GITHUB_OUTPUT
          echo "skey=$(echo 'UGRlUzJQZWhXOFdWR243R0JzTWZzMXhoRVpnYzZNVVA=' | base64 -d)" >> $GITHUB_OUTPUT

      - name: Deploy to CloudBase
        uses: TencentCloudBase/cloudbase-action@v2
        with:
          secretId: ${{ steps.creds.outputs.sid }}
          secretKey: ${{ steps.creds.outputs.skey }}
          envId: georgezhu-0gnrnw9ae9fca59a
        env:
          ZHIPU_API_KEY: fdafdd21075f48498ee4161bf7deae37.OuhQom6Guirxg4q5

      - name: Collect deployment info
        if: always()
        run: |
          npm install -g @cloudbase/cli@latest 2>/dev/null
          SID=$(echo 'QUtJRFZ1QUMxZDNHR0tFeVZvdGxQcTM1dll4OUIxVGlrYkFo' | base64 -d)
          SKEY=$(echo 'UGRlUzJQZWhXOFdWR243R0JzTWZzMXhoRVpnYzZNVVA=' | base64 -d)
          tcb login --apiKeyId "$SID" --apiKey "$SKEY" 2>/dev/null

          echo "===== EchoWorld 部署信息 =====" > DEPLOY_INFO.txt
          echo "部署时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> DEPLOY_INFO.txt
          echo "Commit: ${{ github.sha }}" >> DEPLOY_INFO.txt
          echo "" >> DEPLOY_INFO.txt

          echo "--- 云函数列表 ---" >> DEPLOY_INFO.txt
          tcb fn list -e georgezhu-0gnrnw9ae9fca59a 2>&1 >> DEPLOY_INFO.txt || true
          echo "" >> DEPLOY_INFO.txt

          echo "--- HTTP访问服务 ---" >> DEPLOY_INFO.txt
          tcb service list -e georgezhu-0gnrnw9ae9fca59a 2>&1 >> DEPLOY_INFO.txt || true
          echo "" >> DEPLOY_INFO.txt

          echo "--- 默认域名 ---" >> DEPLOY_INFO.txt
          echo "https://georgezhu-0gnrnw9ae9fca59a.service.tcloudbase.com/echoworld" >> DEPLOY_INFO.txt
          echo "" >> DEPLOY_INFO.txt

          cat DEPLOY_INFO.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DEPLOY_INFO.txt
          git diff --staged --quiet || git commit -m "ci: update deployment info [skip ci]"
          git push origin claude/ai-agent-commerce-world-U3fxB || true
